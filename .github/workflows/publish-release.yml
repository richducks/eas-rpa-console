name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        default: v0.26.0

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
  linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and acceptance
        run: |
          npm test
          npm run check
          npm run acceptance

      - name: Build Linux packages
        run: npm run build:linux -- --publish never

      - name: Create Linux checksums
        run: |
          sha256sum dist/EAS-RPA-Console-*-amd64.deb dist/EAS-RPA-Console-*-x86_64.AppImage > dist/SHA256SUMS-linux.txt

      - name: Upload Linux release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/EAS-RPA-Console-*-amd64.deb \
            dist/EAS-RPA-Console-*-x86_64.AppImage \
            dist/SHA256SUMS-linux.txt \
            --clobber

  windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and acceptance
        run: |
          npm test
          npm run check
          npm run acceptance

      - name: Build Windows installer
        run: npm run build:windows -- --publish never

      - name: Create Windows checksum
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path dist -Filter 'EAS-RPA-Console-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $asset) { throw 'Windows installer not found' }
          $hash = (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLower()
          "$hash  $($asset.Name)" | Set-Content -Path "$($asset.FullName).sha256" -Encoding ascii

      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -Path dist -Filter 'EAS-RPA-Console-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $asset) { throw 'Windows installer not found' }
          gh release upload '${{ inputs.tag }}' $asset.FullName "$($asset.FullName).sha256" --clobber
