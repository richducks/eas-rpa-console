name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Syntax checks
        run: npm run check

      - name: Acceptance guardrails
        run: npm run acceptance

      - name: Verify platform isolation
        shell: bash
        run: |
          matches=$(grep -RIl 'process\.platform' src --include='*.js' || true)
          expected='src/platform/index.js'
          if [ "$matches" != "$expected" ]; then
            echo "process.platform must only appear in $expected"
            echo "Found:"
            echo "$matches"
            exit 1
          fi

          leaks=$(grep -RIlE 'powershell\.exe|taskkill\.exe|secret-tool|/proc/|loginctl|wmctrl|xwininfo|xprop|Atspi' src/core --include='*.js' || true)
          if [ -n "$leaks" ]; then
            echo "OS-specific process/credential/session implementations must stay under src/platform"
            echo "Found in core:"
            echo "$leaks"
            exit 1
          fi

      - name: Acceptance contract
        run: npm run acceptance
